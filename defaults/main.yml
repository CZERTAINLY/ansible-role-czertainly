# defaults file
appliance_user: ilm
appliance_group: ilm
app_namespace: ilm
app_release_name: ilm

# How long a component waits for the database before the init container of
# ilm-values.local.yaml gives up and is retried by the kubelet. Everything
# reaches the database through pg-bouncer, which needs about as long as its
# image pull to come up - 101 seconds when this was measured - so the budget
# is deliberately generous.
ilm_db_wait_seconds: 300

# Components whose images come from the private repository of the registry,
# ilm-private, and not from the public one everything else is pulled from.
# They need docker.username and docker.password of vars/docker.yml: without
# them the install is refused by tasks/main.yml, and their pods would only
# reach ImagePullBackOff. ilm-tui marks them with an asterisk out of this very
# list, so a component becomes private in one place, here.
ilm_private_components:
  - cryptosenseDiscoveryProvider
  - externalAuthorityProvider
  - otpkiConnector
  - timestampFormattingConnector

# Whether the mail server of vars/email.yml is contacted before helm runs.
# The email notification provider starts with spring.mail.test-connection, so
# it connects and authenticates while its context comes up and dies when that
# fails - a wrong host or password ends in CrashLoopBackOff and a 20 minute
# helm timeout that says nothing about mail. Set this to false to install
# anyway, e.g. while the mail server is down; the settings are still checked
# for being present.
ilm_smtp_check: true
ilm_smtp_check_timeout: 10

# The CBOM repository, installed as a release of its own when
# ilm.cbomRepository is set - it is not a part of the ilm chart. Its data lives
# in an object store, not in the database, so it is kept in a directory of the
# host and handed to the release through a PersistentVolume of its own.
# Everything else on the appliance is rebuilt from the database, this one is
# rebuilt from that directory, see the README.
ilm_cbom_release_name: cbom-repository
ilm_cbom_repository_version: "1.1.0"
ilm_cbom_data_dir: /var/lib/ilm/cbom-repo
# The uid the minio container runs as, it has to own the directory above.
ilm_cbom_data_owner: "1000"
ilm_cbom_storage_size: 10Gi
ilm_cbom_bucket: cbom-repo
# The minio console has no ingress on the appliance, so there is nothing to
# reach it with.
ilm_cbom_console: false

# Which ingress controller serves ILM. 'traefik' is what RKE2 deploys by
# default since v1.36 and needs the middlewares and the plugin of traefik.yml
# to get client certificate login working. 'nginx' is what the chart is
# written for, it needs none of that - the annotations the chart sets are
# already the ingress-nginx ones.
ilm_ingress_class: traefik

# The traefik plugin that percent-encodes the client certificate header. It is
# loaded as a local plugin, so nothing is ever fetched from the module path -
# it only names the plugin and the directory the source is mounted into, and
# points at the repository the source in files/certheaderencode lives in.
#
# The last element of the module path has to stay equal to the name of the Go
# package, traefik resolves the plugin as <last element>.New and refuses to
# load it with "undefined: <last element>" when the two differ.
ilm_traefik_plugin_name: certheaderencode
ilm_traefik_plugin_module: github.com/OmniTrustILM/ansible-role-ilm/certheaderencode
